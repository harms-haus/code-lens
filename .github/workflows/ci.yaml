name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify publish dry-run
        run: npm publish --dry-run --tag dev

  regression:
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── Install LSP servers ──────────────────────────────────────────
      - name: Install TypeScript language server
        run: npm install -g typescript-language-server typescript

      - name: Install prettier
        run: npm install -g prettier

      - name: Install Bash language server
        run: npm install -g bash-language-server

      - name: Install YAML language server
        run: npm install -g yaml-language-server

      - name: Install JSON language server
        run: npm install -g vscode-json-languageserver-bin

      - name: Install CSS language server
        run: npm install -g vscode-css-languageserver-bin

      - name: Install PHP language server
        run: npm install -g intelephense

      - name: Install Python LSP
        run: pip install python-lsp-server

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-analyzer
        run: rustup component add rust-analyzer

      - name: Install clangd
        run: sudo apt-get update && sudo apt-get install -y clangd

      - name: Install Ruby LSP
        run: sudo gem install ruby-lsp

      - name: Install HTML language server
        run: npm install -g vscode-html-languageserver-bin

      - name: Install Markdown language server
        run: npm install -g vscode-markdown-languageserver

      - name: Install Vue language server
        run: npm install -g @vue/language-server@2 @vue/typescript-plugin typescript

      - name: Install Dockerfile language server
        run: npm install -g dockerfile-language-server-nodejs

      - name: Install TOML language server (taplo)
        run: npm install -g @taplo/lsp

      - name: Install Terraform language server
        continue-on-error: true
        run: |
          curl --fail --retry 3 -Lo /tmp/terraform-ls.zip https://releases.hashicorp.com/terraform-ls/0.36.0/terraform-ls_0.36.0_linux_amd64.zip
          sudo unzip /tmp/terraform-ls.zip -d /usr/local/bin

      - name: Install Lua language server
        continue-on-error: true
        run: |
          curl --fail --retry 3 -Lo /tmp/lua-language-server.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.13.5/lua-language-server-3.13.5-linux-x64.tar.gz
          sudo mkdir -p /usr/local/lua-language-server
          sudo tar xzf /tmp/lua-language-server.tar.gz -C /usr/local/lua-language-server
          sudo chmod -R a+rw /usr/local/lua-language-server/log
          sudo ln -s /usr/local/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server

      - name: Install Svelte language server
        run: npm install -g svelte-language-server

      # ── Run regression tests ──────────────────────────────────────────
      - name: Run regression tests
        run: npm run test:regression:update

      - name: Upload snapshot artifacts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-snapshots
          path: |
            regression/**/__snapshots__/
          retention-days: 7
